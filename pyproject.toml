[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
dynamic = ["version"]
description = "Biomedical Open Network for Scientific Artificial Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "bmandracchia", email = "biagio.mandracchia@gmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/deepCLEM/bonsai"
Documentation = "https://deepCLEM.github.io/bonsai/"

[project.entry-points.nbdev]
bonsai = "bonsai._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "bonsai.__version__"}

[tool.setuptools.packages.find]
include = ["bonsai"]

[tool.nbdev]
