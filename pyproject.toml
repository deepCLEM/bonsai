[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai"
dynamic = ["version"]
description = "Biomedical Open Network for Scientific Artificial Intelligence"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "bmandracchia", email = "biagio.mandracchia@gmail.com"}
]
keywords = [
    "biomedical imaging",
    "deep learning",
    "microscopy",
    "artificial intelligence",
    "MONAI",
    "fastai",
    "nbdev",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "scikit-learn",
    "scikit-image",
    "torch",
    "monai",
    "fastai",
    "fastcore",
    "plum-dispatch",
]

[project.optional-dependencies]
dev = [
    "nbdev",
    "jupyter",
    "pytest",
]

docs = [
    "nbdev",
    "jupyter",
]

[project.urls]
Repository = "https://github.com/deepCLEM/bonsai"
Documentation = "https://deepCLEM.github.io/bonsai/"

[project.entry-points.nbdev]
bonsai = "bonsai._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "bonsai.__version__"}

[tool.setuptools.packages.find]
include = ["bonsai*"]

[tool.nbdev]
custom_sidebar = false